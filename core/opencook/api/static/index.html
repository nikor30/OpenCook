<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCook – Live</title>
    <link rel="icon" href="/static/icons/live.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
    <style>
      .status {
        font-size: 2.2rem;
        font-weight: 600;
      }
      .remaining {
        font-size: 3.5rem;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .dot {
        display: inline-block;
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        margin-right: 0.4em;
        background: var(--off);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.run {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <nav id="tabs"></nav>

      <section class="card notice warn" id="unconfigured" hidden>
        Noch kein Gerät eingerichtet. Trage IP und Token unter
        <a href="/settings">Einstellungen</a> ein.
      </section>

      <section class="card">
        <div class="status">
          <span id="dot" class="dot"></span><span id="status">–</span>
        </div>
        <div class="muted" id="updated">noch keine Daten</div>
      </section>

      <section class="card">
        <div class="muted">Restzeit</div>
        <div class="remaining" id="remaining">–</div>
      </section>

      <section class="card">
        <dl>
          <dt>Rezept</dt>
          <dd id="cook_name">–</dd>
          <dt class="debug" hidden>Rezept-ID</dt>
          <dd class="debug" hidden id="cook_id">–</dd>
          <dt class="debug" hidden>Typ</dt>
          <dd class="debug" hidden id="cook_type">–</dd>
          <dt class="debug" hidden>Modus</dt>
          <dd class="debug" hidden id="mode">–</dd>
          <dt>Fehlercode</dt>
          <dd id="fault">–</dd>
        </dl>
      </section>

      <section class="card debug" hidden>
        <h2>Rohwerte (siid.piid)</h2>
        <pre id="raw"></pre>
      </section>

      <p class="muted">Nur lesend: OpenCook verändert nichts am Gerät.</p>
    </main>

    <script src="/static/nav.js"></script>
    <script>
      const STATUS_DE = {
        Standby: "Bereit",
        Cooking: "Kocht",
        Paused: "Pausiert",
        Sleep: "Schläft",
        Error: "Fehler",
        Complete: "Fertig",
      };
      const $ = (id) => document.getElementById(id);
      const withLabel = (value, label) =>
        value === null ? "–" : label ? `${label} (${value})` : String(value);
      const mmss = (s) =>
        s === null || s === 0
          ? "–"
          : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

      function render(s) {
        const running = s.status === 1 || s.status === 3;
        $("dot").className =
          "dot " + (!s.reachable ? "" : running ? "run" : "ok");
        $("status").textContent = !s.reachable
          ? "Nicht erreichbar (Standby?)"
          : (STATUS_DE[s.status_label] ?? withLabel(s.status, s.status_label));
        $("updated").textContent =
          "Stand " + new Date(s.updated_at).toLocaleTimeString("de-DE");
        $("remaining").textContent = mmss(s.remaining_s);
        $("cook_name").textContent = s.cook_name ?? "–";
        $("cook_id").textContent = s.cook_id ?? "–";
        $("cook_type").textContent = withLabel(s.cook_type, s.cook_type_label);
        $("mode").textContent = withLabel(s.mode, s.mode_label);
        $("fault").textContent = s.fault ?? "–";
        $("raw").textContent = JSON.stringify(s.raw, null, 2);
      }

      async function tick() {
        try {
          const r = await fetch("/api/state", { cache: "no-store" });
          if (r.ok) render(await r.json());
        } catch {
          $("updated").textContent = "Server nicht erreichbar";
        }
      }

      async function loadSettings() {
        const r = await fetch("/api/settings", { cache: "no-store" });
        if (!r.ok) return;
        const settings = await r.json();
        $("unconfigured").hidden = settings.configured;
        for (const el of document.querySelectorAll(".debug")) {
          el.hidden = !settings.show_debug;
        }
      }

      loadSettings();
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
