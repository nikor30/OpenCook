# Repo-wide tool configuration. The installable package lives in core/pyproject.toml.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core", "tools"]
extend-exclude = ["research/private", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"core/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core/opencook", "core/tests", "tools"]
mypy_path = ["core"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Not installed in CI (python-miio is also untyped): treat them as Any everywhere.
module = ["miio", "miio.*", "playwright", "playwright.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["core/tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
