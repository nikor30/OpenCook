services:
  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    # Optional defaults (OC_DEVICE_IP, OC_DEVICE_TOKEN); settings saved in the web UI take precedence.
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - opencook-data:/data # cook history (SQLite)
    restart: unless-stopped

volumes:
  opencook-data:
